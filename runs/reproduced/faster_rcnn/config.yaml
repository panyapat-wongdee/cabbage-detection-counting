artifacts:
  output_dir: runs/reproduced/faster_rcnn
  result_status: reproduction_candidate
augmentation:
  border_value: 114
  degrees: 15.0
  horizontal_flip: 0.5
  hsv_h: 0.1
  hsv_s: 0.05
  hsv_v: 0.05
  mosaic: 0.0
  normalize: true
  profile: reproduction_augmented
  scale: 0.1
  translate: 0.1
  vertical_flip: 0.5
checkpoint:
  metric: val_map_50_95
  mode: max
  retain_each_epoch: false
dataset:
  annotations: null
  class_names:
  - Cabbage
  format: coco
  labels_dirname: null
  root: original_dataset
  split_manifest: splits/fold1_recovered.csv
  yaml: null
evaluation:
  area_threshold: 0.0
  backend: pycocotools_coco_eval
  confidence_owner: repository
  counting_iou_threshold: null
  max_detections: 100
  nms_owner: repository
execution:
  device: cuda:0
  seed: 42
  workers: 2
final_postprocess:
  area_threshold: 0.0
  confidence_owner: repository
  confidence_threshold: 0.5
  iou_threshold: 0.5
  native_nms_applied: true
  nms_owner: repository
initialization:
  num_classes: 2
  weights: COCO_V1
model:
  detector_input: framework_default
  framework: torchvision
  name: faster_rcnn
native_training:
  cache: true
  empty_target_policy: include
  patience: 500
  train_shuffle: true
  validation_shuffle: false
  warmup_first_epoch: true
overrides:
  native_score_threshold: null
postprocess:
  confidence_threshold: 0.5
  iou_threshold: 0.5
provenance:
  augmentation: repository_protocol
  dataset.path: historical_code
  evaluation: historical_code
  execution.device: repository_default
  execution.seed: unknown
  execution.workers: repository_default
  initialization.weights: historical_code
  scheduler: historical_code
  training.checkpoint_selection: historical_code
  training.epochs: repository_protocol
  training.seed: repository_default
  training.workers: unknown
scheduler:
  final_lr_factor: null
  gamma: 0.1
  name: step_lr
  step_size: 1000
training:
  batch_size: 16
  epochs: 500
  image_size:
  - 512
  - 512
  learning_rate: 0.001
  momentum: 0.9
  optimizer: SGD
  weight_decay: 0.0005
validation_postprocess:
  area_threshold: 0.0
  confidence_owner: repository
  confidence_threshold: 0.5
  iou_threshold: 0.5
  native_nms_applied: true
  nms_owner: repository
