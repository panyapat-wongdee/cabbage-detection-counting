# Controlled experiment: identical to configs/torchvision/fcos.yaml except that
# the detector's own transform keeps the 512x512 image_size instead of
# torchvision's default (800x800 for Faster R-CNN/RetinaNet/FCOS, 300x300
# for SSD, 320x320 for SSDLite). For SSD the anchor steps tied to 300 px are
# cleared. Trained as a repository experiment (README, "Controlled experiment:
# detector input size"); not a published or reproduced setting.
model:
  name: fcos
  framework: torchvision
  detector_input: image_size

dataset:
  format: coco
  root: original_dataset
  split_manifest: splits/fold1_recovered.csv
  yaml: null
  labels_dirname: null
  class_names:
    - Cabbage

initialization:
  weights: COCO_V1
  num_classes: 2

training:
  image_size:
    - 512
    - 512
  optimizer: SGD
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0005
  batch_size: 16
  epochs: 500

augmentation:
  profile: reproduction_augmented
  horizontal_flip: 0.5
  vertical_flip: 0.5
  translate: 0.1
  scale: 0.1
  degrees: 15.0
  hsv_h: 0.1
  hsv_s: 0.05
  hsv_v: 0.05
  mosaic: 0.0
  normalize: true
  border_value: 114

scheduler:
  name: step_lr
  step_size: 1000
  gamma: 0.1
  final_lr_factor: null

postprocess:
  confidence_threshold: 0.5
  iou_threshold: 0.5

evaluation:
  max_detections: 100
  area_threshold: 0.0
  confidence_owner: repository
  nms_owner: repository
  backend: pycocotools_coco_eval

validation_postprocess:
  confidence_threshold: 0.5
  iou_threshold: 0.5
  area_threshold: 0.0
  confidence_owner: repository
  nms_owner: repository
  native_nms_applied: true

final_postprocess:
  confidence_threshold: 0.5
  iou_threshold: 0.5
  area_threshold: 100.0
  confidence_owner: repository
  nms_owner: repository
  native_nms_applied: true

native_training:
  patience: 500
  cache: true
  train_shuffle: true
  validation_shuffle: false
  warmup_first_epoch: true
  empty_target_policy: include

artifacts:
  output_dir: runs/reproduced/fcos-detector512

execution:
  device: cuda:0
  workers: 2
  seed: 42

checkpoint:
  metric: val_map_50_95
  mode: max

provenance:
  model.detector_input: repository_protocol
  training.epochs: repository_protocol
  dataset.path: historical_code
  initialization.weights: historical_code
  augmentation: repository_protocol
  scheduler: historical_code
  evaluation: historical_code
  execution.device: repository_default
  execution.workers: repository_default
  training.seed: repository_default
  training.checkpoint_selection: historical_code
